name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: [ "develop" ] # 当向 branch 分支推送代码时触发这个 Action。

# 设置 GITHUB_TOKEN 的权限，以便可以推送代码到 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 在一个最新的 Ubuntu 系统上运行

    steps:
    - name: Checkout
      uses: actions/checkout@v4 # 拉取你的代码到虚拟机

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # 使用 Node.js 18，你可以根据你的项目需求调整版本
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci # 安装依赖，比 npm install 更快更稳定

    - name: Build
      run: npm run build # 执行构建命令，生成 dist 目录

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3 # 一个非常流行的部署到 GH Pages 的 Action
      with:
        # 使用 GITHUB_TOKEN 来进行身份验证，自动推送 dist 目录到 gh-pages 分支
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist # 要部署的文件夹，就是 Vue 构建后生成的